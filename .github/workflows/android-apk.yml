name: Gerar APK Hydra Agro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar configuração do backend
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Secret VITE_SUPABASE_URL não configurado no repositório."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secret VITE_SUPABASE_PUBLISHABLE_KEY não configurado no repositório."
            exit 1
          fi
          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://.+\.supabase\.co$ ]]; then
            echo "::error::VITE_SUPABASE_URL está em formato inválido."
            exit 1
          fi
          if [ ${#VITE_SUPABASE_PUBLISHABLE_KEY} -le 20 ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY parece inválida."
            exit 1
          fi
          echo "Backend configurado para o build."

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: |
          npm run build
          npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-agro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
