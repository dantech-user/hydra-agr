<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#064b35" />
  <title>Hydra Agro — Prévia do sistema de modais</title>
  <style>
    :root {
      color-scheme: light;
      --forest-950: #052f23;
      --forest-900: #063d2c;
      --forest-800: #07513a;
      --forest-700: #0a6246;
      --forest-100: #e5efe8;
      --cream: #f6f3e9;
      --paper: #fffefa;
      --ink: #12271e;
      --muted: #56655e;
      --line: #dadfd8;
      --orange: #ff8614;
      --orange-soft: #fff0dd;
      --danger: #b3262e;
      --danger-soft: #fff0ef;
      --success: #087a51;
      --nav-height: 76px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      font-family: Manrope, "Avenir Next", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #dfe7e1;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .preview-shell {
      min-height: 100dvh;
      max-width: 540px;
      margin: 0 auto;
      position: relative;
      overflow-x: clip;
      background: var(--cream);
      box-shadow: 0 0 60px rgba(5,47,35,.16);
    }

    .app-content {
      min-height: 100dvh;
      padding: calc(22px + var(--safe-top)) 20px calc(var(--nav-height) + var(--safe-bottom) + 34px);
      transition: padding-bottom 240ms var(--ease);
    }
    .preview-shell.has-overlay .app-content { padding-bottom: 28px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 52px; height: 52px; border-radius: 17px; display: grid; place-items: center;
      background: var(--forest-800); color: var(--orange); box-shadow: 0 10px 25px rgba(6,61,44,.14);
    }
    .brand-mark svg { width: 29px; height: 29px; }
    .brand strong { display: block; color: var(--forest-800); font-size: 20px; letter-spacing: -.04em; }
    .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 1px; }
    .round-button { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); color: var(--forest-900); display: grid; place-items: center; cursor: pointer; }

    .hero { margin: 0 0 25px; }
    .eyebrow { color: var(--orange); font-size: 12px; line-height: 1.2; letter-spacing: .15em; font-weight: 850; }
    .hero h1 { margin: 7px 0 8px; color: var(--forest-950); font-size: clamp(32px, 8vw, 42px); line-height: 1.04; letter-spacing: -.055em; }
    .hero p { max-width: 440px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }

    .property-card { position: relative; overflow: hidden; border-radius: 26px; padding: 24px; color: white; background: var(--forest-800); }
    .property-card::after { content: ""; position: absolute; width: 210px; height: 210px; border: 32px solid rgba(255,255,255,.055); border-radius: 50%; right: -82px; top: -108px; }
    .property-card > * { position: relative; z-index: 1; }
    .property-card small { color: #bed3c7; font-size: 13px; font-weight: 700; }
    .property-card h2 { margin: 6px 0 20px; font-size: 25px; letter-spacing: -.035em; }
    .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .metric { border-top: 1px solid rgba(255,255,255,.2); padding-top: 13px; }
    .metric strong { display: block; font-size: 20px; }
    .metric span { color: #bed3c7; font-size: 11px; }

    .section-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 29px 1px 14px; }
    .section-title h2 { margin: 0; color: var(--forest-950); font-size: 23px; letter-spacing: -.04em; }
    .section-title span { color: var(--muted); font-size: 12px; }
    .action-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .action-card {
      min-height: 132px; text-align: left; border: 1px solid var(--line); border-radius: 22px; padding: 17px;
      background: var(--paper); color: var(--ink); cursor: pointer; transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .action-card:active { transform: scale(.975); }
    .action-card:hover { border-color: #b9c8be; box-shadow: 0 12px 30px rgba(21,54,39,.07); }
    .action-icon { width: 43px; height: 43px; border-radius: 14px; background: var(--forest-100); color: var(--forest-700); display: grid; place-items: center; font-size: 20px; }
    .action-card.orange .action-icon { background: var(--orange-soft); color: #db6b00; }
    .action-card strong { display: block; margin-top: 15px; font-size: 15px; }
    .action-card small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .action-card.full { grid-column: 1/-1; min-height: 98px; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; }
    .action-card.full .action-icon { width: 48px; height: 48px; }
    .action-card.full strong { margin: 0; font-size: 16px; }
    .action-card.full small { margin-top: 5px; }
    .chevron { font-size: 24px; color: var(--forest-800); }

    .bottom-nav {
      position: fixed; z-index: 40; left: 50%; bottom: 0; transform: translate3d(-50%,0,0);
      width: min(100%,540px); height: calc(var(--nav-height) + var(--safe-bottom)); padding: 8px 10px var(--safe-bottom);
      display: grid; grid-template-columns: repeat(5,1fr); border-top: 1px solid rgba(208,216,209,.9);
      background: rgba(255,254,250,.96); backdrop-filter: blur(18px); box-shadow: 0 -12px 36px rgba(14,43,29,.07);
      transition: transform 250ms var(--ease), visibility 0s linear 0s;
      will-change: transform;
    }
    .bottom-nav.is-hidden { transform: translate3d(-50%,calc(100% + 24px),0); visibility: hidden; transition: transform 240ms var(--ease), visibility 0s linear 240ms; }
    .bottom-nav button { border: 0; background: none; color: #68766f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
    .bottom-nav i { font-style: normal; font-size: 20px; }
    .bottom-nav span { font-size: 10px; font-weight: 750; }
    .bottom-nav button.active { color: var(--forest-700); }
    .bottom-nav button.active i { width: 38px; height: 31px; display: grid; place-items: center; border-radius: 12px; background: var(--forest-100); }

    .overlay-layer {
      position: fixed; z-index: 100; inset: 0; display: flex; align-items: flex-end; justify-content: center;
      padding-top: max(10px,calc(var(--safe-top) + 8px)); background: rgba(3,25,17,.7); backdrop-filter: blur(9px);
      animation: overlayIn 220ms ease both; overscroll-behavior: contain;
    }
    .overlay-layer.is-closing { pointer-events: none; animation: overlayOut 220ms ease both; }
    .overlay-layer.is-closing .sheet { animation: sheetOut 230ms var(--ease) both; }
    .overlay-layer.is-stacked { background: rgba(3,25,17,.32); backdrop-filter: blur(4px); }

    .sheet {
      width: min(100%,540px); min-height: 56dvh; max-height: min(70dvh,760px); display: flex; flex-direction: column;
      border-radius: 30px 30px 0 0; background: var(--paper); box-shadow: 0 -24px 80px rgba(0,0,0,.28);
      animation: sheetIn 260ms var(--ease) both; overflow: hidden;
    }
    .sheet.sheet-large { height: min(94dvh,920px); max-height: calc(100dvh - max(10px,calc(var(--safe-top) + 8px))); }
    .sheet.sheet-small { min-height: min(58dvh,560px); max-height: min(66dvh,650px); }
    .sheet-header { flex: 0 0 auto; padding: 8px 20px 16px; background: var(--paper); border-bottom: 1px solid rgba(218,223,216,.78); }
    .handle { width: 48px; height: 5px; margin: 0 auto 16px; border-radius: 99px; background: #c8cec8; }
    .sheet-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .sheet-title-row h2 { margin: 5px 0 0; max-width: 390px; color: var(--forest-950); font-size: clamp(30px,8vw,35px); line-height: 1.08; letter-spacing: -.055em; }
    .close-button { flex: 0 0 auto; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: #f8f7f2; color: var(--ink); font-size: 25px; cursor: pointer; }
    .sheet-body { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 20px 20px calc(22px + var(--safe-bottom)); scroll-padding-bottom: 100px; }
    .sheet-copy { margin: 0 0 20px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .modal-form { min-height: 100%; display: flex; flex-direction: column; gap: 17px; }
    .field { display: grid; gap: 7px; }
    .field > span { color: var(--forest-950); font-size: 14px; font-weight: 800; }
    .field small { color: var(--muted); font-size: 13px; line-height: 1.4; }
    input, select, textarea {
      width: 100%; min-height: 56px; border: 1.5px solid #cbd4cd; border-radius: 15px; padding: 0 15px;
      outline: none; color: var(--ink); background: #fff; font-size: 16px; transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    textarea { min-height: 102px; resize: vertical; padding-block: 14px; }
    input:focus, select:focus, textarea:focus { border-color: var(--forest-700); box-shadow: 0 0 0 4px rgba(10,98,70,.1); }
    .field-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .form-error { margin: 0; border: 1px solid #eeb9b8; border-radius: 14px; padding: 12px 14px; background: var(--danger-soft); color: #8f1d24; font-size: 14px; font-weight: 720; line-height: 1.45; }
    .sheet-actions {
      position: sticky; bottom: calc(-22px - var(--safe-bottom)); z-index: 2; display: grid; grid-template-columns: minmax(112px,.65fr) minmax(0,1.35fr); gap: 10px;
      margin-top: auto; padding: 16px 0 calc(6px + var(--safe-bottom)); background: linear-gradient(to bottom,rgba(255,254,250,0),var(--paper) 14px);
    }
    .button { min-height: 58px; border-radius: 16px; border: 0; padding: 0 18px; font-weight: 850; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
    .button:disabled { cursor: wait; filter: saturate(.7); }
    .button.primary { color: white; background: var(--forest-700); }
    .button.secondary { color: var(--forest-900); border: 1.5px solid #cbd4cd; background: white; }
    .button.orange { color: #3a2004; background: var(--orange); }
    .button.danger { color: white; background: var(--danger); }
    .spinner { width: 19px; height: 19px; border: 2.5px solid rgba(255,255,255,.42); border-top-color: #fff; border-radius: 50%; animation: spin .72s linear infinite; }
    .button.orange .spinner { border-color: rgba(58,32,4,.25); border-top-color: #3a2004; }

    .delete-summary { display: grid; grid-template-columns: 58px 1fr; gap: 15px; align-items: start; border: 1px solid #efc7c5; border-radius: 19px; padding: 17px; background: var(--danger-soft); }
    .delete-icon { width: 58px; height: 58px; border-radius: 17px; display: grid; place-items: center; color: var(--danger); background: white; font-size: 25px; }
    .delete-summary h3 { margin: 2px 0 6px; font-size: 20px; letter-spacing: -.03em; }
    .delete-summary p { margin: 0; color: #6c3d3d; font-size: 15px; line-height: 1.52; }

    .plus-hero { overflow: hidden; position: relative; border-radius: 23px; padding: 23px; color: white; background: var(--forest-800); }
    .plus-hero::after { content: "+"; position: absolute; right: -6px; top: -38px; color: rgba(255,255,255,.07); font-size: 190px; line-height: 1; font-weight: 900; }
    .plus-hero h3 { margin: 10px 0 7px; font-size: 27px; letter-spacing: -.045em; }
    .plus-hero p { margin: 0; max-width: 310px; color: #d2e2d8; font-size: 15px; line-height: 1.5; }
    .feature-list { display: grid; gap: 11px; margin: 16px 0 0; }
    .feature { display: grid; grid-template-columns: 43px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 17px; padding: 13px; }
    .feature i { width: 43px; height: 43px; border-radius: 13px; display: grid; place-items: center; background: var(--orange-soft); font-style: normal; }
    .feature strong { display: block; font-size: 15px; }
    .feature small { color: var(--muted); font-size: 13px; }

    .toast-region { position: fixed; z-index: 200; left: 50%; top: calc(16px + var(--safe-top)); width: min(calc(100% - 28px),510px); transform: translateX(-50%); pointer-events: none; display: grid; gap: 8px; }
    .toast { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-radius: 16px; color: white; background: var(--forest-950); box-shadow: 0 16px 45px rgba(0,0,0,.25); font-size: 14px; font-weight: 750; animation: toastIn 240ms var(--ease) both; }
    .toast i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--success); font-style: normal; }

    @keyframes overlayIn { from { opacity: 0; backdrop-filter: blur(0); } }
    @keyframes overlayOut { to { opacity: 0; backdrop-filter: blur(0); } }
    @keyframes sheetIn { from { transform: translate3d(0,102%,0); } to { transform: translate3d(0,0,0); } }
    @keyframes sheetOut { to { transform: translate3d(0,105%,0); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.97); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 390px) {
      .app-content { padding-inline: 15px; }
      .action-grid { gap: 9px; }
      .action-card { padding: 14px; }
      .sheet-header, .sheet-body { padding-inline: 16px; }
      .field-row { grid-template-columns: 1fr; }
      .sheet-actions { grid-template-columns: 1fr; }
      .button.secondary { order: 2; }
    }
    @media (min-width: 720px) {
      body { padding-block: 20px; }
      .preview-shell { min-height: calc(100dvh - 40px); border-radius: 32px; }
      .bottom-nav { bottom: 20px; border-radius: 0 0 32px 32px; }
      .overlay-layer { align-items: center; padding: 24px; }
      .sheet { border-radius: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="preview-shell" id="app">
    <div class="app-content">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M16 3C13 8 8 12.4 8 19a8 8 0 1 0 16 0c0-6.6-5-11-8-16Z" fill="currentColor"/><path d="M12 21c1.2 2 3.6 3 6 2.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
          </div>
          <div><strong>Hydra Agro</strong><small>TECNOLOGIA RURAL</small></div>
        </div>
        <button class="round-button" aria-label="Notificações">●</button>
      </header>

      <section class="hero">
        <span class="eyebrow">PRÉVIA INTERATIVA</span>
        <h1>Boa tarde, Daniel.</h1>
        <p>Teste cada fluxo. A barra inferior sai por completo, o conteúdo ganha altura e todas as ações exibem feedback.</p>
      </section>

      <section class="property-card">
        <small>PROPRIEDADE ATIVA</small>
        <h2>Fazenda Boa Água</h2>
        <div class="metrics"><div class="metric"><strong>—</strong><span>Água hoje</span></div><div class="metric"><strong>0</strong><span>Animais</span></div><div class="metric"><strong>0</strong><span>Alertas</span></div></div>
      </section>

      <div class="section-title"><h2>Ações para testar</h2><span>toque para abrir</span></div>
      <section class="action-grid">
        <button class="action-card" data-open="water"><span class="action-icon">◉</span><strong>Registrar água</strong><small>Formulário alto com scroll interno</small></button>
        <button class="action-card orange" data-open="animal"><span class="action-icon">♢</span><strong>Cadastrar animal</strong><small>Campos, foto e identificação</small></button>
        <button class="action-card" data-open="sector"><span class="action-icon">⌖</span><strong>Criar setor</strong><small>Confirmação e loading</small></button>
        <button class="action-card" data-open="delete"><span class="action-icon">⌫</span><strong>Excluir publicação</strong><small>Ação destrutiva protegida</small></button>
        <button class="action-card full orange" data-open="plus"><span class="action-icon">✦</span><span><strong>Conhecer Hydra Agro+</strong><small>Assinatura sem cobrança simulada</small></span><span class="chevron">›</span></button>
      </section>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal">
      <button class="active"><i>⌂</i><span>Início</span></button><button><i>◉</i><span>Água</span></button><button><i>♢</i><span>Rebanho</span></button><button><i>⌖</i><span>Monitorar</span></button><button><i>○</i><span>Perfil</span></button>
    </nav>
  </main>

  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <template id="water-template">
    <form class="modal-form" data-form data-success="Leitura registrada com sucesso" data-loading="Salvando leitura...">
      <p class="sheet-copy">Informe uma leitura real. O histórico e os indicadores serão atualizados sem recarregar a página.</p>
      <div class="field-row"><label class="field"><span>Data</span><input type="date" value="2026-08-16" required></label><label class="field"><span>Quantidade (L)</span><input inputmode="decimal" placeholder="Ex.: 850" required></label></div>
      <label class="field"><span>Origem</span><select required><option value="">Selecione uma fonte</option><option>Cisterna principal</option><option>Poço artesiano</option></select></label>
      <label class="field"><span>Finalidade</span><select><option>Consumo animal</option><option>Irrigação</option><option>Limpeza</option></select></label>
      <label class="field"><span>Observação</span><textarea placeholder="Informação importante sobre esta leitura"></textarea><small>Opcional. O texto permanece caso o envio falhe.</small></label>
      <div class="sheet-actions"><button class="button secondary" type="button" data-close>Cancelar</button><button class="button primary" type="submit">Confirmar leitura</button></div>
    </form>
  </template>

  <template id="animal-template">
    <form class="modal-form" data-form data-success="Animal cadastrado com sucesso" data-loading="Salvando animal...">
      <p class="sheet-copy">Crie a ficha individual. Nenhuma informação será perdida enquanto o formulário permanecer aberto.</p>
      <div class="field-row"><label class="field"><span>Identificação</span><input placeholder="Ex.: BR-0042" required></label><label class="field"><span>Nome</span><input placeholder="Nome opcional"></label></div>
      <div class="field-row"><label class="field"><span>Espécie</span><select><option>Bovino</option><option>Equino</option><option>Caprino</option></select></label><label class="field"><span>Raça</span><input placeholder="Ex.: Nelore"></label></div>
      <div class="field-row"><label class="field"><span>Sexo</span><select><option>Fêmea</option><option>Macho</option></select></label><label class="field"><span>Nascimento</span><input type="date"></label></div>
      <div class="field-row"><label class="field"><span>Peso (kg)</span><input inputmode="decimal" placeholder="0"></label><label class="field"><span>Situação</span><select><option>Ativo</option><option>Vendido</option><option>Em tratamento</option></select></label></div>
      <label class="field"><span>Identificação eletrônica</span><input placeholder="NFC/RFID — opcional"><small>A leitura real depende de aparelho Android compatível.</small></label>
      <label class="field"><span>Observações</span><textarea placeholder="Manejo, saúde ou característica do animal"></textarea></label>
      <div class="sheet-actions"><button class="button secondary" type="button" data-close>Cancelar</button><button class="button primary" type="submit">Confirmar animal</button></div>
    </form>
  </template>

  <template id="sector-template">
    <form class="modal-form" data-form data-success="Setor criado com sucesso" data-loading="Criando setor...">
      <p class="sheet-copy">Mapeie uma parte da propriedade para relacionar atividades e monitoramentos.</p>
      <label class="field"><span>Nome do setor</span><input placeholder="Ex.: Pasto 1" required></label>
      <label class="field"><span>Tipo</span><select><option>Pasto</option><option>Curral</option><option>Plantação</option><option>Reserva</option><option>Área de água</option></select></label>
      <label class="field"><span>Descrição</span><textarea placeholder="Limites, finalidade ou observações"></textarea></label>
      <div class="sheet-actions"><button class="button secondary" type="button" data-close>Cancelar</button><button class="button primary" type="submit">Confirmar setor</button></div>
    </form>
  </template>

  <template id="delete-template">
    <form class="modal-form" data-form data-success="Publicação excluída" data-loading="Excluindo...">
      <div class="delete-summary"><span class="delete-icon">⌫</span><div><h3>Publicação da Fazenda Boa Água</h3><p>O texto, a imagem, as curtidas e os comentários serão removidos. Esta ação não pode ser desfeita.</p></div></div>
      <p class="sheet-copy">Confirme somente se deseja remover definitivamente este conteúdo da comunidade.</p>
      <div class="sheet-actions"><button class="button secondary" type="button" data-close>Cancelar</button><button class="button danger" type="submit">Confirmar exclusão</button></div>
    </form>
  </template>

  <template id="plus-template">
    <div class="modal-form">
      <div class="plus-hero"><span class="eyebrow">PLANO OPCIONAL</span><h3>Hydra Agro+</h3><p>Mais inteligência para acompanhar a propriedade, sem fingir uma cobrança ou ativação.</p></div>
      <div class="feature-list"><div class="feature"><i>⌁</i><span><strong>Histórico avançado</strong><small>Visões produtivas com seus próprios dados</small></span></div><div class="feature"><i>◎</i><span><strong>Metas da propriedade</strong><small>Acompanhamento hídrico e rural</small></span></div><div class="feature"><i>⌖</i><span><strong>Monitoramento ampliado</strong><small>Preparado para futuras integrações</small></span></div></div>
      <p class="sheet-copy">A contratação real dependerá de um provedor de pagamento conectado posteriormente.</p>
      <div class="sheet-actions"><button class="button secondary" type="button" data-close>Agora não</button><button class="button orange" type="button" data-demo-plus>Tenho interesse</button></div>
    </div>
  </template>

  <script>
    (() => {
      const app = document.querySelector('#app');
      const nav = document.querySelector('#bottomNav');
      const toastRegion = document.querySelector('#toasts');
      const stack = [];
      const catalog = {
        water: { title: 'Registrar água', eyebrow: 'NOVA LEITURA', size: 'large' },
        animal: { title: 'Cadastrar animal', eyebrow: 'NOVA FICHA', size: 'large' },
        sector: { title: 'Criar setor', eyebrow: 'MAPEAMENTO', size: 'small' },
        delete: { title: 'Excluir publicação?', eyebrow: 'CONFIRMAÇÃO OBRIGATÓRIA', size: 'small', stacked: true },
        plus: { title: 'Um plano para evoluir', eyebrow: 'HYDRA AGRO+', size: 'large' }
      };

      function syncNavigation() {
        const hidden = stack.length > 0;
        nav.classList.toggle('is-hidden', hidden);
        nav.setAttribute('aria-hidden', String(hidden));
        app.classList.toggle('has-overlay', hidden);
        document.body.style.overflow = hidden ? 'hidden' : '';
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<i>✓</i><span></span>';
        toast.querySelector('span').textContent = message;
        toastRegion.appendChild(toast);
        window.setTimeout(() => toast.remove(), 2600);
      }

      function closeLayer(layer, afterClose) {
        if (!layer || layer.dataset.closing === 'true') return;
        layer.dataset.closing = 'true';
        layer.classList.add('is-closing');
        window.setTimeout(() => {
          const index = stack.indexOf(layer);
          if (index >= 0) stack.splice(index, 1);
          layer.remove();
          syncNavigation();
          afterClose?.();
        }, 230);
      }

      function createLayer(kind) {
        const spec = catalog[kind];
        const template = document.querySelector(`#${kind}-template`);
        const layer = document.createElement('div');
        layer.className = `overlay-layer ${stack.length ? 'is-stacked' : ''}`;
        layer.setAttribute('role', 'presentation');
        layer.innerHTML = `<section class="sheet sheet-${spec.size}" role="dialog" aria-modal="true" aria-label="${spec.title}"><header class="sheet-header"><div class="handle"></div><div class="sheet-title-row"><div><span class="eyebrow">${spec.eyebrow}</span><h2>${spec.title}</h2></div><button class="close-button" type="button" aria-label="Fechar">×</button></div></header><div class="sheet-body"></div></section>`;
        layer.querySelector('.sheet-body').append(template.content.cloneNode(true));
        layer.addEventListener('pointerdown', (event) => { if (event.target === layer) closeLayer(layer); });
        layer.querySelector('.close-button').addEventListener('click', () => closeLayer(layer));
        layer.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeLayer(layer)));
        layer.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeLayer(layer); });

        const form = layer.querySelector('[data-form]');
        if (form) form.addEventListener('submit', event => {
          event.preventDefault();
          if (!form.reportValidity() || form.dataset.busy === 'true') return;
          form.dataset.busy = 'true';
          const button = form.querySelector('[type="submit"]');
          const previous = button.innerHTML;
          button.disabled = true;
          button.innerHTML = `<span class="spinner"></span>${form.dataset.loading}`;
          form.querySelectorAll('input,select,textarea').forEach(field => field.setAttribute('aria-busy','true'));
          window.setTimeout(() => {
            form.dataset.busy = 'false';
            button.disabled = false;
            button.innerHTML = previous;
            closeLayer(layer, () => showToast(form.dataset.success));
          }, 1150);
        });

        const plusButton = layer.querySelector('[data-demo-plus]');
        if (plusButton) plusButton.addEventListener('click', () => {
          if (plusButton.disabled) return;
          plusButton.disabled = true;
          plusButton.innerHTML = '<span class="spinner"></span>Registrando interesse...';
          window.setTimeout(() => closeLayer(layer, () => showToast('Interesse registrado. Nenhuma cobrança foi realizada.')), 1050);
        });
        return layer;
      }

      function openLayer(kind) {
        const layer = createLayer(kind);
        document.body.appendChild(layer);
        stack.push(layer);
        syncNavigation();
        window.setTimeout(() => layer.querySelector('input,select,button')?.focus({ preventScroll: true }), 270);
      }

      document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => openLayer(button.dataset.open)));
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && stack.length) closeLayer(stack.at(-1)); });
    })();
  </script>
</body>
</html>
